
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Papa Tom – AR Karte 3</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    #status {
      position: fixed;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 12px;
      border-radius: 9px;
      background: rgba(0,0,0,.72);
      color: white;
      font: 15px Arial, sans-serif;
      text-align: center;
      pointer-events: none;
    }

    #startButton {
      position: fixed;
      z-index: 1001;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: none;
      border-radius: 30px;
      background: white;
      color: black;
      font: 16px Arial, sans-serif;
    }

    #startButton[hidden] { display: none; }
  </style>
</head>

<body>
  <div id="status">
    Kamera starten und Karte 3 ins Bild halten …
  </div>

  <button id="startButton" hidden>
    Animation starten
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets timeout="30000">
      <video
        id="animation3"
        src="./animation3.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#animation3"
        width="1"
        height="1.4145"
        position="0 0 0.02"
        visible="false"
        material="shader: flat; side: double; transparent: false">
      </a-video>

    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const video = document.getElementById('animation3');
    const target = document.getElementById('target');
    const videoPlane = document.querySelector('a-video');
    const startButton = document.getElementById('startButton');
    const scene = document.querySelector('a-scene');

    let targetVisible = false;

    video.muted = true;
    video.playsInline = true;

    async function startAnimation() {
      if (!targetVisible) return;

      try {
        await video.play();

        if (!targetVisible) {
          video.pause();
          return;
        }

        videoPlane.setAttribute('visible', true);
        startButton.hidden = true;
        status.textContent = '✓ Karte erkannt';
        status.style.background = 'rgba(0,120,40,.75)';

      } catch (error) {
        if (!targetVisible) return;

        status.textContent = 'Zum Starten bitte unten tippen';
        startButton.hidden = false;
      }
    }

    target.addEventListener('targetFound', () => {
      targetVisible = true;
      video.currentTime = 0;
      startAnimation();
    });

    target.addEventListener('targetLost', () => {
      targetVisible = false;
      video.pause();
      video.currentTime = 0;
      videoPlane.setAttribute('visible', false);
      startButton.hidden = true;

      status.textContent =
        'Karte nicht erkannt – Kamera erneut ausrichten';
      status.style.background = 'rgba(0,0,0,.72)';
    });

    startButton.addEventListener('click', () => {
      startAnimation();
    });

    scene.addEventListener('arError', () => {
      status.textContent =
        'AR-Fehler: Kameraberechtigung und HTTPS prüfen';
    });
  </script>
</body>
</html>
